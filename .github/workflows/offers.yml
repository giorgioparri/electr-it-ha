name: Offers

# Once a day, read the daily file of the Portale Offerte and keep the offers/
# folder up to date on the market-data branch, next to market_values.json:
# index.json plus one file per first two hex digits of the hash of the offer
# code. The integration downloads the index and one file only while a
# contract is being set up. The daily run writes only the files that changed.
#
# offers.json, the single file of schema 1 that v0.1.0-beta.6 read, was
# removed from the branch with the release of v0.1.0. tools/update_offers.py
# --convert still turns a copy of it into the offers/ folder.
#
# Daily runs only. The runner has 1 GB of memory, and a backfill holds the
# whole archive in memory: past days are read on a desktop with
# tools/update_offers.py --backfill, and the folder is pushed from there.
# The runner never starts an archive: with offers/index.json missing the run
# fails, rather than keep the offers of one day only.
#
# When the daily update fails, an issue is opened (one at a time); it is
# closed by the first daily run that goes fine.

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# One writer at a time on the data branch for this workflow; the market
# values workflow writes another file there, so a push that loses the race
# is rebased and retried below.
concurrency:
  group: offers
  cancel-in-progress: false

env:
  DATA_BRANCH: market-data
  ISSUE_TITLE: "Offers: the automatic update needs attention"

jobs:
  update:
    # The Portale refuses GitHub's hosted runners (HTTP 403 from their data
    # centre addresses): the job runs on a self-hosted runner labelled
    # "portale". It starts only from the schedule and by hand, never from a
    # pull request, so code from a fork never reaches that machine.
    runs-on: [self-hosted, linux, portale]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # The data branch is checked out next to the code, with its history so
      # that a rebase is possible. The first time it does not exist yet: it
      # starts as a branch with no history of its own. The runner keeps its
      # workspace between runs: a worktree left behind by a run that stopped
      # half way is pruned first, and the data branch is checked out detached,
      # so no local branch is left for the next checkout to trip over.
      - name: Check out the data branch
        run: |
          git worktree remove --force data 2>/dev/null || true
          git worktree prune
          git branch -D "$DATA_BRANCH" 2>/dev/null || true
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git fetch origin "$DATA_BRANCH"
            git worktree add --detach data "origin/$DATA_BRANCH"
          else
            git worktree add --detach data
            git -C data checkout --orphan "$DATA_BRANCH"
            git -C data rm -rfq .
          fi

      - name: Update the offers
        id: update
        run: |
          set +e
          python tools/update_offers.py --output data/offers \
            > changes.txt 2> errors.txt
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          added=$(grep -c '^added ' changes.txt || true)
          changed=$(grep -c '^changed ' changes.txt || true)
          withdrawn=$(grep -c '^withdrawn ' changes.txt || true)
          echo "counts=$added added, $changed changed, $withdrawn withdrawn" >> "$GITHUB_OUTPUT"
          cat errors.txt
          {
            echo "### Offers"
            echo
            echo "$added added, $changed changed, $withdrawn withdrawn."
            echo '```'
            cat errors.txt changes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The commit message carries the counts and the first lines only; the
      # full list is in the summary.
      - name: Publish on the data branch
        if: steps.update.outputs.status == '0'
        working-directory: data
        env:
          COUNTS: ${{ steps.update.outputs.counts }}
        run: |
          git add offers
          if git diff --cached --quiet; then
            echo "Nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "Update offers: $COUNTS"
            echo
            head -n 50 ../changes.txt
          } > ../message.txt
          git commit -q -F ../message.txt
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/$DATA_BRANCH"; then
              exit 0
            fi
            echo "Push refused, rebasing on the branch (attempt $attempt)."
            git fetch origin "$DATA_BRANCH"
            git rebase "origin/$DATA_BRANCH"
          done
          exit 1

      - name: Open an issue
        if: steps.update.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" \
            --json number,title --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")
          if [ -n "$open" ]; then
            echo "Issue #$open is already open."
            exit 0
          fi
          {
            echo "The daily update of \`offers/\` on the \`$DATA_BRANCH\` branch reported:"
            echo
            echo '```'
            cat errors.txt
            echo '```'
            echo
            echo "Run: $RUN_URL"
            echo
            echo "Nothing was written: the folder stays as it was after the last good run."
          } > body.md
          gh issue create --title "$ISSUE_TITLE" --body-file body.md

      - name: Close the issue
        if: steps.update.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" \
            --json number,title --jq "map(select(.title == env.ISSUE_TITLE)) | .[].number" |
          while read -r number; do
            gh issue close "$number" --comment "Fixed: the update runs cleanly again."
          done

      - name: Fail when nothing was updated
        if: steps.update.outputs.status != '0'
        run: exit 1

      # Leave the runner's workspace as the next checkout expects it.
      - name: Remove the data worktree
        if: always()
        run: |
          git worktree remove --force data 2>/dev/null || true
          git worktree prune
          git branch -D "$DATA_BRANCH" 2>/dev/null || true
