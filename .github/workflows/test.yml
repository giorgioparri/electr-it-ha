name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # 3.14, the version Home Assistant 2026.3 and later run on
          # (hacs.json requires 2026.8).
          python-version-file: .python-version
      # The engine is pure Python: the tests need nothing installed, not even
      # Home Assistant.
      - name: Run bill tests
        run: python tests/test_bills.py
      - name: Run time band tests
        run: python tests/test_bands.py
      - name: Run estimate tests
        run: python tests/test_estimate.py
      - name: Run market value tests
        run: python tests/test_market.py
      - name: Run counter tests
        run: python tests/test_counters.py
      - name: Run PUN average tests
        run: python tests/test_pun.py
      - name: Run GME message tests
        run: python tests/test_gme.py
      - name: Run published value tests
        run: python tests/test_published.py
      - name: Run published rate tests
        run: python tests/test_published_rates.py
      - name: Run Portale Offerte tests
        run: python tests/test_offers.py
      - name: Run offer lookup tests
        run: python tests/test_catalogue.py
      # The AI prompt in both READMEs must hold a valid contract model that
      # names every field and value of the schema.
      - name: Run AI prompt tests
        run: python tests/test_prompt.py
      # The updater reads PDFs with pypdf only in the scheduled workflow: its
      # tests build every document as text and need nothing installed either.
      - name: Run market value updater tests
        run: python tests/test_update_market_values.py
      # The offers updater is tested against a fake download, on daily files
      # built from the real offers in tests/fixtures.
      - name: Run offers updater tests
        run: python tests/test_update_offers.py
      # The parameters updater is tested against a fake download, on the
      # real parameters file of the Portale in tests/fixtures.
      - name: Run Portale parameters updater tests
        run: python tests/test_update_portale_parameters.py
